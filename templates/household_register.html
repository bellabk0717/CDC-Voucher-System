<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static',filename='styles.css') }}">
    <title>Household Registration</title>
</head>
<body>
    <div class="container">
        <h2>Household Registration</h2>
        <p>Register your household to claim CDC vouchers.</p>
        
        <form method="POST" action="/household/register">
            <div class="input-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <div class="input-group">
                <label for="name">Full Name:</label>
                <input type="text" id="name" name="name" required>
            </div>
            
            <div class="input-group">
                <label for="nric">NRIC/FIN:</label>
                <input type="text" id="nric" name="nric" required maxlength="9" placeholder="S1234567A">
            </div>
            
            <button type="submit">Register</button>
        </form>
        
        <form action="/main" method="get" style="margin-top: 20px;">
            <button type="submit">Back to Main</button>
        </form>
    </div>
</body>
</html>
